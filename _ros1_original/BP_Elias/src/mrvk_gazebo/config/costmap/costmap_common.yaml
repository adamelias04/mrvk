transform_tolerance: 0.3

robot_radius: 0.28

obstacles:
  enabled: true
  footprint_clearing_enabled: true
  observation_sources: scan_marking scan_clearing

  scan_marking:
    data_type: LaserScan
    topic: /scan
    sensor_frame: sensor_laser_link
    marking: true
    clearing: false
    inf_is_valid: false
    obstacle_range: 3.4
    raytrace_range: 3.7

  scan_clearing:
    data_type: LaserScan
    topic: /scan
    sensor_frame: sensor_laser_link
    marking: false
    clearing: true
    inf_is_valid: true
    obstacle_range: 3.4
    raytrace_range: 7.0

  observation_persistence: 0.0
  expected_update_rate: 0.0

predicted_path_obstacle_layer:
  enabled: true
  path_topic: /predicted_obstacle_path
  obstacle_radius: 0.25
  max_path_length: 3.0
  robot_exclusion_radius: 0.55
  path_staleness_tolerance: 0.5

  cost_value: 255

inflation_layer:
  enabled: true
  inflation_radius: 0.35
  cost_scaling_factor: 6.0

obstacle_range: 3.4
raytrace_range: 3.7
