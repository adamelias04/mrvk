# PLACEHOLDER: min_height/max_height/range_max are first-pass defaults,
# need tuning against the real environment once hardware is available
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: lidar_frame
    transform_tolerance: 0.02
    min_height: -0.1
    max_height: 0.5
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.2
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
