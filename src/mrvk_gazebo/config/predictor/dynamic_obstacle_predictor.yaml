dynamic_obstacle_predictor:
  ros__parameters:
    obstacle_cloud_topic: /ground_segmentation/obstacle_points
    output_frame: odom
    prediction_time: 4.0
    prediction_dt: 0.1
    alpha_gain: 0.65
    beta_gain: 0.20
    max_speed: 2.0
    track_timeout: 1.2
    lost_track_prediction_time: 1.6

    # Motion is judged over a window rather than frame to frame: a single
    # difference amplifies the ~0.1-0.2 m of jitter a partially-observed
    # cluster's position naturally has into an apparent 0.3 m/s, which is
    # exactly the speed a walking person moves at.
    # Length of the regression window the velocity is fitted over. A fit
    # across W seconds returns the AVERAGE velocity over that window, i.e.
    # the heading the object had at its midpoint -- so the published heading
    # lags reality by W/2. On a straight path that is invisible; on a curved
    # one it is the whole error. Measured on jk0009 (person walking a circle,
    # track 51): at 3.0 the heading was 43 deg off and matched the truth from
    # 1.2 s earlier; at 1.2 it is 14 deg off with a 0.4 s lag.
    motion_window: 1.2
    min_motion_window: 0.6
    # Separate from the window above on purpose: this is only how long a
    # verdict survives without new measurements, so a mover that is briefly
    # occluded keeps its prediction.
    motion_staleness: 3.0
    min_dynamic_speed: 0.25

    # Static/dynamic is decided by whether the ground the object covered a
    # moment ago has cleared, not by how fast its centroid appears to move.
    # A fence stays put; only its visible slice slides as the robot drives
    # past, and no amount of velocity filtering can tell those apart.
    persistence_delay: 1.5        # preferred lookback for the verdict
    persistence_fast_delay: 0.7   # shortest lookback that may be judged at all
    persistence_keep_extra: 0.5
    persistence_min_points: 5     # in-range footprint anchors needed to judge
    persistence_smoothing: 0.35
    footprint_points: 24
    max_persistence: 0.3          # at full lookback: cleared this much == moving
    moving_persistence: 0.2       # stricter bar demanded of a short lookback
    static_confirm_persistence: 0.45
    static_confirm_samples: 2     # repeats before a track is latched scenery
    occupancy_match_radius: 0.35
    occupancy_support_count: 3    # lone stray points do not prove occupancy

    point_spacing: 0.05
    corridor_radius: 0.18
    object_half_extent: 0.18
    z_height: 0.10
    scan_range_min_use: 0.10
    scan_range_max_use: 15.00
    segment_jump_distance: 0.30
    segment_min_points: 20
    # Only a runaway guard, NOT a size filter -- size is what
    # segment_max_width is for. A point count means "how close is it", not
    # "how big is it": the Livox puts 400-1600 points on a person at 3-4 m,
    # so a cap of 600 (harmless back when the input was a LaserScan with a
    # few hundred rays per scan) silently deleted every pedestrian the robot
    # got near -- they never became a segment at all, let alone a track.
    segment_max_points: 5000
    segment_min_width: 0.03
    # Deliberately generous: a long structure has to be allowed to form ONE
    # cluster so it can be tracked and latched as scenery. Rejecting it
    # outright only scattered it into short-lived fragments that each looked
    # like a fresh moving object.
    segment_max_width: 4.00
    use_angle_roi: false
    angle_min_roi: -1.57
    angle_max_roi: 1.57
    use_range_roi: false
    range_min_roi: 0.20
    range_max_roi: 8.00
    initial_expected_angle: 0.0
    initial_expected_range: 2.5
    max_association_distance: 2.0
    publish_debug_segment: true
    max_tracks: 25
