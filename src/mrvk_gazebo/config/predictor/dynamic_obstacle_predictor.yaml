dynamic_obstacle_predictor:
  ros__parameters:
    obstacle_cloud_topic: /ground_segmentation/obstacle_points
    output_frame: odom
    prediction_time: 4.0
    prediction_dt: 0.1
    alpha_gain: 0.65
    beta_gain: 0.20
    max_speed: 2.0
    track_timeout: 1.2
    lost_track_prediction_time: 1.6
    prediction_hold_time: 0.8
    prediction_hold_speed_epsilon: 0.08
    min_dynamic_speed: 0.3
    min_dynamic_persist: 0.2
    point_spacing: 0.05
    corridor_radius: 0.18
    object_half_extent: 0.18
    center_side_hysteresis: 0.5
    z_height: 0.10
    scan_range_min_use: 0.10
    scan_range_max_use: 8.00
    segment_jump_distance: 0.30
    segment_min_points: 30
    segment_max_points: 600
    segment_min_width: 0.03
    segment_max_width: 2.00
    use_angle_roi: false
    angle_min_roi: -1.57
    angle_max_roi: 1.57
    use_range_roi: false
    range_min_roi: 0.20
    range_max_roi: 8.00
    initial_expected_angle: 0.0
    initial_expected_range: 2.5
    max_association_distance: 2.0
    publish_debug_segment: true
    max_tracks: 10
